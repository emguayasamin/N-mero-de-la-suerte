<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Número de la Suerte</title><link rel="stylesheet" href="styles.css"></head><body><main class="wrap"><section id="loginCard" class="card login"><h1>🔐 Administración</h1><p>Inicia sesión para administrar Número de la Suerte.</p><form id="loginForm"><input id="email" type="email" placeholder="Correo" required><input id="password" type="password" placeholder="Contraseña" required><button>INGRESAR</button></form><p id="loginMsg" class="msg"></p></section><section id="dashboard" hidden><header class="top"><div><h1>🎟️ Número de la Suerte</h1><p>Panel de administración</p></div><button id="logout" class="secondary">Cerrar sesión</button></header><section class="stats"><div class="stat"><span>Disponibles</span><strong id="available">0</strong></div><div class="stat"><span>Reservados</span><strong id="reserved">0</strong></div><div class="stat"><span>Pagados</span><strong id="paid">0</strong></div><div class="stat"><span>Recaudado</span><strong id="money">$0</strong></div></section><section class="card"><div class="toolbar"><input id="search" placeholder="Buscar nombre, teléfono o número..."><select id="filter"><option value="all">Todos</option><option value="reserved">Reservados</option><option value="paid">Pagados</option></select><button id="refresh" class="secondary">Actualizar</button></div><div class="tableWrap"><table><thead><tr><th>Número</th><th>Participante</th><th>Teléfono</th><th>Estado</th><th>Reserva</th><th>Acción</th></tr></thead><tbody id="tbody"></tbody></table></div></section><p id="dashMsg" class="msg"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script src="app.js"></script></body></html>
