<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Número de la Suerte</title><link rel="stylesheet" href="styles.css"></head><body><header class="hero"><div class="badge">🎟️ RIFA</div><h1>Número de la Suerte</h1><p>¡Participa por una <strong>PlayStation 5</strong>!</p><div class="price">$1 <span>por número</span></div></header><main><section class="stats"><div><b id="availableCount">—</b><span>Disponibles</span></div><div><b id="reservedCount">—</b><span>Reservados</span></div><div><b id="selectedCount">0</b><span>Seleccionados</span></div></section><section class="card"><div class="toolbar"><div><h2>Elige tus números</h2><p>Selecciona uno o varios.</p></div><input id="search" type="number" min="1" max="1000" placeholder="Buscar número"></div><div class="legend"><span>🟦 Disponible</span><span>🟨 Seleccionado</span><span>🟥 Reservado</span></div><div id="grid" class="grid"></div></section><section class="card form-card"><h2>Datos para reservar</h2><form id="reservationForm"><label>Nombre completo<input id="name" required minlength="2"></label><label>Teléfono<input id="phone" required minlength="7"></label><div class="summary"><div><span>Números:</span><strong id="summaryNumbers">Ninguno</strong></div><div><span>Total:</span><strong id="total">$0</strong></div></div><button id="clearBtn" type="button" class="secondary">Limpiar selección</button><button id="submitBtn" type="submit">RESERVAR MIS NÚMEROS</button><div id="message" class="message" hidden></div></form></section></main><footer>Número de la Suerte</footer><script src="config.js"></script><script src="app.js"></script></body></html>
